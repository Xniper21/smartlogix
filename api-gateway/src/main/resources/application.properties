server.port=8000
spring.application.name=api-gateway
spring.cloud.gateway.routes[0].id=inventario-service
spring.cloud.gateway.routes[0].uri=${INVENTARIO_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/inventario/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/inventario/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[1].id=pedidos-service
spring.cloud.gateway.routes[1].uri=${PEDIDOS_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/pedidos/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/pedidos/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[2].id=bff-service
spring.cloud.gateway.routes[2].uri=${BFF_SERVICE_URL:http://localhost:8090}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bff/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/bff/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[3].id=envios-service
spring.cloud.gateway.routes[3].uri=${ENVIOS_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/envios/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/envios/(?<segment>.*), /${segment}

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Authorization,Cache-Control,Content-Type
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always