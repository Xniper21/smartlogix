server.port=8090
spring.application.name=bff-service
inventario.service.url=${INVENTARIO_SERVICE_URL:http://localhost:8081}
pedidos.service.url=${PEDIDOS_SERVICE_URL:http://localhost:8082}
envios.service.url=${ENVIOS_SERVICE_URL:http://localhost:8083}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bff_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartlogix123}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=smartlogixSecretKeyForJWTsmartlogixSecretKeyForJWT0123456789ABCD
jwt.expiration=86400000